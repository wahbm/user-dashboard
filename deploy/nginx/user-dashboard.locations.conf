# Include this file from the existing EIP server block only.
# Nginx strips /ww/user-dashboard/ before proxying to the private Node service.

location = /ww/user-dashboard {
    return 308 /ww/user-dashboard/;
}

location ^~ /ww/user-dashboard/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /ww/user-dashboard;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
    proxy_pass http://127.0.0.1:3100/;
}
